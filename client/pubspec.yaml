name: client
description: "ProjectHub — Project Management Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1

  # Immutability & Codegen
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking
  dio: ^5.8.0+1

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Animations
  flutter_animate: ^4.5.2

  # Native Splash
  flutter_native_splash: ^2.4.6

  # Localization
  intl: any
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.4
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
